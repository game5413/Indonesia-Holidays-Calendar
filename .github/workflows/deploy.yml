name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      year:
        description: Year (default current)
        required: false
        type: string
  workflow_call:
    inputs:
      year:
        description: Year (default current)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Generate Calendar
      run: python main.py --output ics,json --name calendar ${{ inputs.year && format('--year {0}', inputs.year) || '' }}
    - name: Get current year
      id: date
      run: echo "date=${{ inputs.year || '$(date +%Y)' }}" >> $GITHUB_OUTPUT
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.date.outputs.date }}
        tag_name: ${{ steps.date.outputs.date }}
        files: |
          calendar.ics
          calendar.json
          LICENSE
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
